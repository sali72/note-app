[project]
name = "my-inner-pages"
version = "0.4.0-alpha"
description = "AI-boosted Journaling API"
authors = [
    {name = "Seyed Ali Hashemi", email = "sahashemi072@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi<1.0.0,>=0.109.0",
    "uvicorn[standard]<1.0.0,>=0.27.0",
    "pydantic<3.0.0,>=2.5.0",
    "pydantic-settings<3.0.0,>=2.1.0",
    "beanie<2.0.0,>=1.26.0",
    "motor<4.0.0,>=3.4.0",
    "pymongo<5.0.0,>=4.6.3",
    "python-dotenv<2.0.0,>=1.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "bcrypt==4.1.2",
    "email-validator<3.0.0,>=2.1.0",
    "structlog<25.0.0,>=24.1.0",
    "resend>=2.0.0,<3.0.0",
    "litellm==1.91.1",
    "slowapi>=0.1.9,<1.0.0",
    "limits>=3.13.0,<4.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "redis[hiredis]>=5.0.0,<6.0.0",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "pytest-asyncio<1.0.0,>=0.23.2",
    "httpx<1.0.0,>=0.26.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-n auto"
asyncio_mode = "strict"
